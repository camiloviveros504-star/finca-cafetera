# `docker compose up` levanta los dos contenedores del diagrama C4 nivel 2: la aplicación y PostgreSQL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finca
      POSTGRES_PASSWORD: finca_local
      POSTGRES_DB: finca
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finca -d finca"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finca:finca_local@db:5432/finca
      SESSION_SECRET: demo-local-no-usar-en-produccion-0000000000
      # Código para crear la organización y el administrador en /instalacion (cámbielo; solo se usa una vez).
      CODIGO_INSTALACION: ${CODIGO_INSTALACION:-instalacion-local-0001}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
